<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Testrahmen iPhone / iPad</title>
<style>
  body { margin: 0; padding: 16px; background: #0c0f12; display: flex; gap: 24px; align-items: flex-start; font-family: system-ui; color: #8e9aa6; }
  figure { margin: 0; display: grid; gap: 6px; }
  iframe { border: 0; border-radius: 28px; background: #1a2027; box-shadow: 0 0 0 8px #000; }
</style>
</head>
<body>
<figure><iframe id="phone" src="../index.html" width="390" height="844" title="iPhone"></iframe><figcaption>iPhone 390 × 844</figcaption></figure>
<figure class="ipad" hidden><div style="width:492px;height:708px;overflow:hidden"><iframe id="ipad" src="about:blank" width="820" height="1180" title="iPad" style="transform:scale(.6);transform-origin:0 0"></iframe></div><figcaption>iPad 820 × 1180 (verkleinert)</figcaption></figure>
<script>if (location.hash === '#ipad') { document.querySelector('.ipad').hidden = false; document.getElementById('ipad').src = '../index.html'; }</script>
</body>
</html>
