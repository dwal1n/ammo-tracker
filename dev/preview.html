<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ammo Tracker – Stilvorschau</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  body { padding: 28px; }
  h1, h2 { font-family: var(--font-label); font-stretch: condensed; font-weight: 700; line-height: 1; margin: 0 0 6px; }
  h1 { font-size: 44px; }
  h2 { font-size: 28px; margin-top: 40px; }
  .intro { color: var(--muted); max-width: 62ch; margin: 0 0 8px; }
  .board { display: flex; flex-wrap: wrap; gap: 28px 34px; align-items: flex-end; padding: 22px; background: var(--surface); border-radius: var(--r-l); }
  .board figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .board figcaption { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .group { display: flex; gap: 22px; align-items: flex-end; }
  .phones { display: flex; flex-wrap: wrap; gap: 32px; margin-top: 12px; }
  .phone { width: 390px; height: 800px; overflow: hidden; border-radius: 44px; border: 10px solid #0c0f12; background: var(--bg); position: relative; box-shadow: 0 30px 60px rgba(0,0,0,.4); }
  .phone .status { height: 44px; }
  .phone header { display: flex; justify-content: space-between; align-items: center; padding: 4px 18px 10px; }
  .phone header .label { font-size: 38px; }
  .phone header button { min-height: 40px; width: 40px; background: var(--brass-soft); color: var(--brass); font-size: 26px; line-height: 1; }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 4px 26px; background: var(--surface); border-top: 1px solid var(--line); font-size: 11px; text-align: center; color: var(--muted); }
  .tabbar span.on { color: var(--brass); }
  .tabbar i { display: block; font-style: normal; font-size: 20px; margin-bottom: 2px; }
  .finish { display: block; margin: 16px 18px 0; width: calc(100% - 36px); background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 600; }
  .types { display: flex; gap: 30px; align-items: flex-end; }
</style>
</head>
<body>
<h1>Stilvorschau</h1>
<p class="intro">Alle Patronen werden aus ihren Maßen gezeichnet und stehen hier im echten Größenverhältnis zueinander. Die beiden Telefone zeigen den Bestand und ein laufendes Training mit Beispieldaten.</p>

<h2>Kalibertafel</h2>
<div class="board" id="board"></div>

<h2>Geschossformen</h2>
<div class="board types" id="types"></div>

<h2>So sieht es auf dem iPhone aus</h2>
<div class="phones">
  <div class="phone" id="p-stock"></div>
  <div class="phone" id="p-train"></div>
</div>

<script type="module">
import { renderSections } from './preview-render.js';
for (const [id, html] of Object.entries(renderSections())) document.getElementById(id).innerHTML = html;
</script>
</body>
</html>
