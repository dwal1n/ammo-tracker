<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ammo Tracker – Stilvorschau</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  body { padding: 28px; }
  h1, h2 { font-family: var(--font-label); font-stretch: condensed; font-weight: 700; line-height: 1; margin: 0 0 6px; }
  h1 { font-size: 44px; }
  h2 { font-size: 28px; margin-top: 40px; }
  .intro { color: var(--muted); max-width: 62ch; margin: 0 0 8px; }
  .board { display: flex; flex-wrap: wrap; gap: 28px 34px; align-items: flex-end; padding: 22px; background: var(--surface); border-radius: var(--r-l); }
  .board figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .board figcaption { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .group { display: flex; gap: 22px; align-items: flex-end; }
  .phones { display: flex; flex-wrap: wrap; gap: 32px; margin-top: 12px; }
  .phone { width: 390px; height: 800px; overflow: hidden; border-radius: 44px; border: 10px solid #0c0f12; background: var(--bg); position: relative; box-shadow: 0 30px 60px rgba(0,0,0,.4); }
  .phone .status { height: 44px; }
  .phone header { display: flex; justify-content: space-between; align-items: center; padding: 4px 18px 10px; }
  .phone header .label { font-size: 38px; }
  .phone header button { min-height: 40px; width: 40px; background: var(--brass-soft); color: var(--brass); font-size: 26px; line-height: 1; }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 4px 26px; background: var(--surface); border-top: 1px solid var(--line); font-size: 11px; text-align: center; color: var(--muted); }
  .tabbar span.on { color: var(--brass); }
  .tabbar i { display: block; font-style: normal; font-size: 20px; margin-bottom: 2px; }
  .finish { display: block; margin: 16px 18px 0; width: calc(100% - 36px); background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 600; }
  .types { display: flex; gap: 30px; align-items: flex-end; }
</style>
</head>
<body>
<h1>Stilvorschau</h1>
<p class="intro">Alle Patronen werden aus ihren Maßen gezeichnet und stehen hier im echten Größenverhältnis zueinander. Die beiden Telefone zeigen den Bestand und ein laufendes Training mit Beispieldaten.</p>

<h2>Kalibertafel</h2>
<div class="board" id="board"></div>

<h2>Geschossformen</h2>
<div class="board types" id="types"></div>

<h2>So sieht es auf dem iPhone aus</h2>
<div class="phones">
  <div class="phone" id="p-stock"></div>
  <div class="phone" id="p-train"></div>
</div>

<script type="module">
import { DEFAULT_CALIBERS, FAMILY_LABELS, BULLET_LABELS } from '../js/calibers.js';
import { cartridgeSVG } from '../js/cartridge-svg.js';

const byId = Object.fromEntries(DEFAULT_CALIBERS.map(c => [c.id, c]));

// Kalibertafel
const board = document.getElementById('board');
for (const fam of Object.keys(FAMILY_LABELS)) {
  const g = document.createElement('div');
  g.className = 'group';
  for (const c of DEFAULT_CALIBERS.filter(c => c.family === fam)) {
    g.insertAdjacentHTML('beforeend', `<figure>${cartridgeSVG(c, { scale: 3.2, shadow: true })}<figcaption>${c.name}</figcaption></figure>`);
  }
  board.append(g);
}

// Geschossformen am Beispiel 9 mm Luger / .38 / .308
const types = document.getElementById('types');
const demo = [['c-9luger', 'fmj'], ['c-9luger', 'hp'], ['c-38spl', 'lead'], ['c-32swl', 'wc'], ['c-308', 'spitzer']];
for (const [id, b] of demo) {
  types.insertAdjacentHTML('beforeend', `<figure>${cartridgeSVG(byId[id], { scale: 5, bullet: b, shadow: true })}<figcaption>${BULLET_LABELS[b]}</figcaption></figure>`);
}

const fmt = n => n.toLocaleString('de-DE');
const eur = n => n.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
const tabbar = on => `<nav class="tabbar">${[['▤','Bestand'],['◎','Training'],['▥','Verlauf'],['⌖','Waffen'],['⚙','Mehr']].map(([i,t]) => `<span class="${t===on?'on':''}"><i>${i}</i>${t}</span>`).join('')}</nav>`;

// Bestand
const stock = [
  { id: 'c-9luger', loads: [['Geco FMJ 124 gr', 1000, 0.27], ['S&B FMJ 115 gr', 240, 0.31]], min: 300 },
  { id: 'c-22lr', loads: [['RWS Target Rifle', 350, 0.12]], min: 500 },
  { id: 'c-38spl', loads: [['Geco LRN 158 gr', 150, 0.42]], min: 100 },
  { id: 'c-223', loads: [['PPU FMJ 55 gr', 180, 0.55]], min: 100 },
  { id: 'c-12-70', loads: [['Rottweil Trap 24 g', 75, 0.39]], min: 50 },
];
const total = s => s.loads.reduce((a, l) => a + l[1], 0);
document.getElementById('p-stock').innerHTML = `
  <div class="status"></div>
  <header><span class="label">Bestand</span><button aria-label="Hinzufügen">+</button></header>
  <div class="parade">${stock.map(s => {
    const c = byId[s.id], low = total(s) < s.min;
    return `<div class="parade-item ${low ? 'low' : ''}">${cartridgeSVG(c, { scale: 2.4 })}<span class="num">${fmt(total(s))}</span></div>`;
  }).join('')}</div>
  ${stock.slice(0, 4).map(s => {
    const c = byId[s.id], t = total(s), low = t < s.min;
    return `<div class="stock-row ${low ? 'low' : ''}">
      <div class="thumb">${cartridgeSVG(c, { height: 60 })}</div>
      <div class="label name">${c.name}${low ? '<span class="badge-low">unter ' + fmt(s.min) + '</span>' : ''}</div>
      <div class="num total">${fmt(t)}<small>Schuss</small></div>
      <div class="loads">${s.loads.map(l => `<div class="load"><span>${l[0]}</span><span class="q">${fmt(l[1])}</span><span class="p">${eur(l[2])}</span></div>`).join('')}</div>
    </div>`;
  }).join('')}
  ${tabbar('Bestand')}`;

// Training
const c9 = byId['c-9luger'];
const strings = [[25, '18:42'], [25, '18:51'], [15, '19:03']];
document.getElementById('p-train').innerHTML = `
  <div class="status"></div>
  <header><span class="label">Training</span><span class="muted" style="font-size:14px">seit 18:35 · SV Musterstadt</span></header>
  <div class="counter"><div class="num">65</div><div class="sub">Schuss heute · ${eur(65 * 0.27)}</div></div>
  <div class="chip-row">
    <button class="chip">${cartridgeSVG(c9, { height: 34 })}<span><b>Glock 17</b>Geco FMJ 124 gr</span></button>
  </div>
  <div class="quick">
    ${[5, 10, 15, 20, 25, 50].map(n => `<button>${n}</button>`).join('')}
  </div>
  <div class="strings">${strings.slice().reverse().map((s, i) => `<div class="string"><span class="n">${strings.length - i}.</span><span>Glock 17 · ${s[1]}</span><span class="num">${s[0]}</span></div>`).join('')}</div>
  <button class="finish">Training beenden</button>
  ${tabbar('Training')}`;
</script>
</body>
</html>
